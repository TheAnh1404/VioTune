name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      REACT_APP_API_URL: http://127.0.0.1:8000
      REACT_APP_FIREBASE_API_KEY: test-key
      REACT_APP_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      REACT_APP_FIREBASE_PROJECT_ID: test-project
      REACT_APP_FIREBASE_STORAGE_BUCKET: test.firebasestorage.app
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "123"
      REACT_APP_FIREBASE_APP_ID: test-app
      REACT_APP_FIREBASE_MEASUREMENT_ID: test-measurement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommendation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recommendation/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/test_sqlite_resiliency.py
      - run: python test_content.py
